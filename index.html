<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Konfigurátor Cedulky</title>
    <!-- Google Font Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            color: #212529;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            display: flex;
            flex-direction: row;
        }

        /* SIDEBAR LIGHT THEME */
        #sidebar {
            width: 360px;
            background-color: #ffffff;
            padding: 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 24px rgba(0,0,0,0.06);
            z-index: 10;
            flex-shrink: 0;
            border-right: 1px solid #e9ecef;
        }
        
        #viewport {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
            overflow: hidden;
            background-color: #f4f5f7;
            /* Vzor tečkovaného sešitu s křížkem každý 4. bod */
            background-image: 
                radial-gradient(#adb5bd 1.5px, transparent 1.5px),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M117 120h6v-6h-6v6zm0-120h6v6h-6V0zM0 117h6v6H0v-6zM0 0h6v6H0V0z' fill='%208c98a4' fill-opacity='0.4'/%3E%3C/svg%3E");
            background-size: 30px 30px, 120px 120px;
            background-position: 0 0, 0 0;
        }

        h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: #00888e;
            margin-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #495057;
            display: flex;
            justify-content: space-between;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            color: #212529;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #00adb5;
            box-shadow: 0 0 0 3px rgba(0, 173, 181, 0.15);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            accent-color: #00adb5;
        }

        .color-pickers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .color-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6c757d;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #00adb5;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 173, 181, 0.25);
        }
        .btn-primary:hover {
            background-color: #00939a;
        }

        .btn-video {
            background-color: #ff9f43;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 159, 67, 0.25);
        }
        .btn-video:hover {
            background-color: #ee872b;
        }

        .btn-photo {
            background-color: #10ac84;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 172, 132, 0.25);
        }
        .btn-photo:hover {
            background-color: #0e9673;
        }

        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        .btn-secondary:hover {
            background-color: #e9ecef;
        }

        /* MODÁLNÍ OKNO SWISS DESIGN */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(33, 37, 41, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            max-width: 860px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            border: 1px solid #e9ecef;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            background: #f4f5f7;
        }
        .gallery-item a {
            color: #00adb5;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* RESPONSIVNÍ DESIGN */
        @media (max-width: 800px) {
            body {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 50vh;
                max-height: 50vh;
                padding: 16px;
                gap: 16px;
            }
            #viewport {
                width: 100%;
                height: 50vh;
            }
        }
    </style>

    <!-- Three.js + Loaders + Exporters -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- WebM Writer pro export 360 videa -->
    <script src="https://cdn.jsdelivr.net/npm/webm-writer@0.2.0/webm-writer.js"></script>
</head>
<body>

    <div id="viewport"></div>

    <div id="sidebar">
        <div>
            <h2>Typ Cedulky</h2>
            <div class="control-group" style="margin-top: 8px;">
                <select id="modeSelect">
                    <option value="text">Cedulka s textem (cedulka.stl)</option>
                    <option value="qr" selected>Cedulka s QR kódem (qr.stl)</option>
                </select>
            </div>
        </div>

        <!-- SEKTOR TEXT -->
        <div id="sectionText" style="display: none;">
            <h2>Nastavení Textu</h2>
            <div class="control-group">
                <label>Vlastní Text:</label>
                <input type="text" id="textInput" value="-20%">
            </div>
            <div class="control-group" style="margin-top: 10px;">
                <label>Velikost Písma: <span id="val_Velikost_Pisma">17</span></label>
                <input type="range" id="Velikost_Pisma" min="5" max="40" step="1" value="17">
            </div>
            <div class="control-group" style="margin-top: 10px;">
                <label>Vystoupení Textu: <span id="val_Vyska_Pisma">4.5</span> mm</label>
                <input type="range" id="Vyska_Pisma" min="0.5" max="15" step="0.5" value="4.5">
            </div>
        </div>

        <!-- SEKTOR QR KÓD -->
        <div id="sectionQR">
            <h2>Nastavení QR Kódu</h2>
            <div class="control-group">
                <label>URL / Text pro QR:</label>
                <input type="text" id="qrInput" value="https://example.com">
            </div>
            <div class="control-group" style="margin-top: 10px;">
                <label>Výška QR (Extruze): <span id="val_Vyska_QR">3</span> mm</label>
                <input type="range" id="Vyska_QR" min="0.5" max="10" step="0.5" value="3">
            </div>
        </div>

        <div>
            <h2>Barvy</h2>
            <div class="color-pickers" style="margin-top: 8px;">
                <div class="color-unit">
                    <label>Stojánek</label>
                    <input type="color" id="Barva_Stojanku" value="#222222">
                </div>
                <div class="color-unit">
                    <label>Cedulka</label>
                    <input type="color" id="Barva_Cedulky" value="#ff0000">
                </div>
                <div class="color-unit">
                    <label id="lblBarvaPrvku">QR Kód</label>
                    <input type="color" id="Barva_Textu" value="#ffffff">
                </div>
            </div>
        </div>

        <div>
            <h2>Export a Náhledy</h2>
            <div class="btn-container">
                <button id="btnRenderVideo" class="btn btn-video">Stáhnout 360° Video (.webm)</button>
                <button id="btnRenderPhotos" class="btn btn-photo">Vygenerovat náhledové fotky</button>
                <button id="btnExportSTL" class="btn btn-primary">Stáhnout STL model</button>
                <button id="btnExportSCAD" class="btn btn-secondary">Stáhnout .SCAD kód</button>
            </div>
        </div>
    </div>

    <!-- Modální okno pro náhledové fotky -->
    <div id="photoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Vygenerované Náhledy</h2>
                <button class="close-btn" onclick="closeModal()">Zavřít</button>
            </div>
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <script>
        // --- 1. INITIAL SCENE SETUP ---
        const container = document.getElementById('viewport');
        const scene = new THREE.Scene();

        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Zvětšené zorné pole (FOV 50) a upravená výchozí kamera pro zobrazení celého modelu
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -170, 70);
        camera.up.set(0, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x000000, 0); // Průhledné pozadí pro vyniknutí CSS tečkovaného vzoru
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 25);

        // Osvětlení přizpůsobené světlému motivu
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(60, -80, 100);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-60, 80, 60);
        scene.add(dirLight2);

        // --- 2. MATERIÁLY A LOADERY ---
        const stlLoader = new THREE.STLLoader();
        const fontLoader = new THREE.FontLoader();

        const matStojanek = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
        const matCedulka = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.5 });
        const matPrvek = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

        let meshStojanek, meshCedulka, meshPrvek;
        let loadedFont = null;

        const UHEL_RAD = 119.1 * (Math.PI / 180);

        const POSUN_NAHORU_TEXT = 0.3;
        const configText = {
            Posun_X: 10.0,
            Posun_Y: -4.5 + (POSUN_NAHORU_TEXT * Math.cos(UHEL_RAD)),
            Posun_Z: 32 + (POSUN_NAHORU_TEXT * Math.sin(UHEL_RAD)),
            Rotace_X: UHEL_RAD,
            Rotace_Y: 180 * (Math.PI / 180),
            Rotace_Z: 0
        };

        const POSUN_NAHORU_QR = 14.8; 
        const configQR = {
            Posun_X: 10.0, 
            Posun_Y: -4.5 + (POSUN_NAHORU_QR * Math.cos(UHEL_RAD)),
            Posun_Z: 32 + (POSUN_NAHORU_QR * Math.sin(UHEL_RAD)),
            Rotace_X: UHEL_RAD,
            Rotace_Y: 180 * (Math.PI / 180),
            Rotace_Z: 0
        };

        // --- 3. NAČÍTÁNÍ STL SOUBORŮ ---
        function loadSTL(filename, material, onLoaded) {
            stlLoader.load(
                filename,
                (geometry) => {
                    const mesh = new THREE.Mesh(geometry, material);
                    modelGroup.add(mesh);
                    onLoaded(mesh);
                },
                undefined,
                () => {
                    let geo = filename.includes('stojanek') 
                        ? new THREE.BoxGeometry(60, 40, 10) 
                        : new THREE.BoxGeometry(80, 5, 80);
                    const mesh = new THREE.Mesh(geo, material);
                    modelGroup.add(mesh);
                    onLoaded(mesh);
                }
            );
        }

        loadSTL('stojanek.stl', matStojanek, (m) => meshStojanek = m);

        function updateCedulkaMesh() {
            if (meshCedulka) {
                modelGroup.remove(meshCedulka);
                if (meshCedulka.geometry) meshCedulka.geometry.dispose();
            }
            const mode = document.getElementById('modeSelect').value;
            const filename = (mode === 'text') ? 'cedulka.stl' : 'qr.stl';
            loadSTL(filename, matCedulka, (m) => meshCedulka = m);
        }

        updateCedulkaMesh();

        // --- 4. GENERACE OBSAHU ---
        fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
            loadedFont = font;
            updateContent();
        });

        function createQRMesh(text, targetSizeMm = 60, height = 3, material) {
            const qr = qrcode(0, 'M');
            qr.addData(text || " ");
            qr.make();

            const moduleCount = qr.getModuleCount();
            const cellSize = targetSizeMm / moduleCount;

            const qrGroup = new THREE.Group();
            const boxGeo = new THREE.BoxGeometry(cellSize, cellSize, height);

            for (let r = 0; r < moduleCount; r++) {
                for (let c = 0; c < moduleCount; c++) {
                    if (qr.isDark(r, c)) {
                        const cellMesh = new THREE.Mesh(boxGeo, material);
                        const x = (c + 0.5) * cellSize - targetSizeMm / 2;
                        const y = -((r + 0.5) * cellSize - targetSizeMm / 2);
                        cellMesh.position.set(x, y, height / 2);
                        qrGroup.add(cellMesh);
                    }
                }
            }
            return qrGroup;
        }

        function updateContent() {
            const mode = document.getElementById('modeSelect').value;

            if (meshPrvek) {
                modelGroup.remove(meshPrvek);
                meshPrvek = null;
            }

            if (mode === 'text') {
                if (!loadedFont) return;
                const textStr = document.getElementById('textInput').value || " ";
                const size = parseFloat(document.getElementById('Velikost_Pisma').value);
                const height = parseFloat(document.getElementById('Vyska_Pisma').value);

                const textGeo = new THREE.TextGeometry(textStr, {
                    font: loadedFont,
                    size: size,
                    height: height,
                    curveSegments: 12
                });
                textGeo.computeBoundingBox();
                textGeo.center();

                meshPrvek = new THREE.Mesh(textGeo, matPrvek);
                
                const offsetZ = height / 2;
                const normalY = Math.sin(UHEL_RAD) * offsetZ;
                const normalZ = -Math.cos(UHEL_RAD) * offsetZ;

                meshPrvek.position.set(
                    configText.Posun_X, 
                    configText.Posun_Y + normalY, 
                    configText.Posun_Z + normalZ
                );
                meshPrvek.rotation.set(configText.Rotace_X, configText.Rotace_Y, configText.Rotace_Z, 'XYZ');
            } else {
                const qrText = document.getElementById('qrInput').value || " ";
                const height = parseFloat(document.getElementById('Vyska_QR').value);

                meshPrvek = createQRMesh(qrText, 60, height, matPrvek);
                meshPrvek.position.set(configQR.Posun_X, configQR.Posun_Y, configQR.Posun_Z);
                meshPrvek.rotation.set(configQR.Rotace_X, configQR.Rotace_Y, configQR.Rotace_Z, 'XYZ');
            }

            modelGroup.add(meshPrvek);
        }

        // --- 5. EVENTY ---
        document.getElementById('modeSelect').addEventListener('change', (e) => {
            const isText = e.target.value === 'text';
            document.getElementById('sectionText').style.display = isText ? 'block' : 'none';
            document.getElementById('sectionQR').style.display = isText ? 'none' : 'block';
            document.getElementById('lblBarvaPrvku').innerText = isText ? 'Text' : 'QR Kód';
            
            updateCedulkaMesh();
            updateContent();
        });

        document.getElementById('textInput').addEventListener('input', updateContent);
        document.getElementById('qrInput').addEventListener('input', updateContent);

        ['Velikost_Pisma', 'Vyska_Pisma', 'Vyska_QR'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const valElem = document.getElementById('val_' + id);
                if (valElem) valElem.innerText = e.target.value;
                updateContent();
            });
        });

        document.getElementById('Barva_Stojanku').addEventListener('input', (e) => matStojanek.color.set(e.target.value));
        document.getElementById('Barva_Cedulky').addEventListener('input', (e) => matCedulka.color.set(e.target.value));
        document.getElementById('Barva_Textu').addEventListener('input', (e) => matPrvek.color.set(e.target.value));

        // --- 6. OPRAVENÝ 360° VIDEO EXPORT (CELEK V ZÁBĚRU) ---
        async function export360Video() {
            const btn = document.getElementById('btnRenderVideo');
            const originalText = btn.innerText;
            btn.disabled = true;

            const totalFrames = 90;
            const radius = 170; // Dostatečný odstup kamery
            const height = 65;

            const videoWriter = new WebMWriter({
                quality: 0.9,
                frameRate: 30
            });

            const origPos = camera.position.clone();
            const origTarget = controls.target.clone();

            controls.target.set(0, 0, 25);

            for (let i = 0; i < totalFrames; i++) {
                // Začínáme od Math.PI pro přímý pohled na přední stranu
                const angle = Math.PI + (i / totalFrames) * Math.PI * 2;
                
                camera.position.x = Math.sin(angle) * radius;
                camera.position.y = Math.cos(angle) * radius;
                camera.position.z = height;

                controls.update();
                renderer.render(scene, camera);

                videoWriter.addFrame(renderer.domElement);

                btn.innerText = `Generuji video: ${Math.round(((i + 1) / totalFrames) * 100)}%`;
                await new Promise(r => setTimeout(r, 10));
            }

            btn.innerText = "Komprimuji...";
            const blob = await videoWriter.complete();

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'cedulka_360_prehlidka.webm';
            link.click();

            camera.position.copy(origPos);
            controls.target.copy(origTarget);
            controls.update();
            renderer.render(scene, camera);

            btn.innerText = originalText;
            btn.disabled = false;
        }

        document.getElementById('btnRenderVideo').addEventListener('click', export360Video);

        // --- 7. OPRAVENÉ NÁHLEDOVÉ FOTKY (PŘEDNÍ STRANA + CELÝ MODEL) ---
        function renderMultipleViews() {
            const origPos = camera.position.clone();
            const origTarget = controls.target.clone();

            // Správně nasměrované úhly s dostatečnou vzdáleností
            const views = [
                { name: "Přední pohled", pos: [0, -170, 35], target: [0, 0, 25] },
                { name: "Izometrický pohled", pos: [130, -130, 90], target: [0, 0, 25] },
                { name: "Boční detail", pos: [-150, -60, 50], target: [0, 0, 25] },
                { name: "Pohled shora", pos: [0, -20, 180], target: [0, 0, 20] }
            ];

            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";

            views.forEach((view, index) => {
                camera.position.set(...view.pos);
                controls.target.set(...view.target);
                controls.update();
                renderer.render(scene, camera);

                const dataURL = renderer.domElement.toDataURL('image/png');

                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${dataURL}" alt="${view.name}">
                    <span style="font-size:0.8rem; font-weight:600; color:#495057;">${view.name}</span>
                    <a href="${dataURL}" download="nahled_${index + 1}.png">Stáhnout obrázek</a>
                `;
                galleryGrid.appendChild(item);
            });

            camera.position.copy(origPos);
            controls.target.copy(origTarget);
            controls.update();
            renderer.render(scene, camera);

            document.getElementById('photoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('photoModal').style.display = 'none';
        }

        document.getElementById('btnRenderPhotos').addEventListener('click', renderMultipleViews);

        // --- 8. EXPORT STL ---
        document.getElementById('btnExportSTL').addEventListener('click', () => {
            const exporter = new THREE.STLExporter();
            const exportGroup = new THREE.Group();
            if (meshCedulka) exportGroup.add(meshCedulka.clone());
            if (meshPrvek) exportGroup.add(meshPrvek.clone());

            const result = exporter.parse(exportGroup, { binary: true });
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'cedulka_model.stl';
            link.click();
        });

        // --- 9. EXPORT SCAD ---
        document.getElementById('btnExportSCAD').addEventListener('click', () => {
            const mode = document.getElementById('modeSelect').value;
            let scadContent = "";

            if (mode === 'text') {
                scadContent = `/* Nastavení Textu */
Vlastni_Text = "${document.getElementById('textInput').value}"; 
Velikost_Pisma = ${document.getElementById('Velikost_Pisma').value}; 
Vyska_Pisma = ${document.getElementById('Vyska_Pisma').value}; 

Barva_Stojanku = "${document.getElementById('Barva_Stojanku').value}"; 
Barva_Cedulky = "${document.getElementById('Barva_Cedulky').value}"; 
Barva_Textu = "${document.getElementById('Barva_Textu').value}"; 

color(Barva_Stojanku) import("stojanek.stl");
color(Barva_Cedulky) import("cedulka.stl");
color(Barva_Textu) {
    translate([${configText.Posun_X.toFixed(2)}, ${configText.Posun_Y.toFixed(2)}, ${configText.Posun_Z.toFixed(2)}])
    rotate([119.1, 180, 0])
    linear_extrude(height = Vyska_Pisma)
        text(text = Vlastni_Text, size = Velikost_Pisma, halign = "center", valign = "center");
}`;
            } else {
                scadContent = `/* Nastavení QR */
QR_Text = "${document.getElementById('qrInput').value}"; 
Vyska_QR = ${document.getElementById('Vyska_QR').value}; 

Barva_Stojanku = "${document.getElementById('Barva_Stojanku').value}"; 
Barva_Cedulky = "${document.getElementById('Barva_Cedulky').value}"; 
Barva_QR = "${document.getElementById('Barva_Textu').value}"; 

color(Barva_Stojanku) import("stojanek.stl");
color(Barva_Cedulky) import("qr.stl");`;
            }

            const blob = new Blob([scadContent], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'cedulka.scad';
            link.click();
        });

        // --- 10. RESIZE A ANIMACE ---
        function onWindowResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.addEventListener('resize', onWindowResize);
        setTimeout(onWindowResize, 100);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
